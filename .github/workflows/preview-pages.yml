name: Preview — GitHub Pages

on:
  push:
    branches: [feature/cloud-run-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lfs-github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build static SPA
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Verify static entry point
        run: |
          test -s dist/client/index.html
          echo "Static entry point generated:"
          ls -lh dist/client/index.html
          echo "Generated files:"
          find dist/client -maxdepth 2 -type f | sort | head -100

      - name: Add GitHub Pages SPA fallback
        run: |
          cp dist/client/index.html dist/client/404.html
          test -s dist/client/404.html
          echo "SPA fallback generated: dist/client/404.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed website response
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking public endpoint: ${PAGES_URL}"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 8 --max-time 30 \
            "${PAGES_URL}" -o /tmp/lfs-pages-index.html
          grep -qi '<html' /tmp/lfs-pages-index.html
          grep -q '/Le-Franc-Symbolique-/' /tmp/lfs-pages-index.html
          echo "Public page returned HTTP 200 and contains the expected project base path."
